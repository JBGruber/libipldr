[package]
name = 'libipldr'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.81'
license = "MIT"
description = "R binding to the Rust IPLD library"
authors = ["Johannes B. Gruber <johannesb.gruber@gmail.com>"]

[lib]
crate-type = [ 'staticlib' ]
name = 'libipldr'

[dependencies]
extendr-api = '0.8.2'
ipld-core = "0.4"
serde_ipld_dagcbor = { version = "0.7", features = ["less-strict-decoding"] }
anyhow = "1.0.75"

[profile.release]
lto = true
codegen-units = 1
